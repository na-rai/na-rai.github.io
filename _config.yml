title: "Nazifa Anjum" # PLACEHOLDER — change to your name
description: "Portfolio of Nazifa Anjum — [I study CSE at Islamic University of Technology]" # PLACEHOLDER
baseurl: ""
url: "https://na-rai.github.io" # PLACEHOLDER — replace your-username

# Author / contact info shown across the site
author:
  name: "Nazifa Anjum" # PLACEHOLDER
  email: "nazifaanjum@iut-dhaka.edu" # PLACEHOLDER
  github: "na-rai" # PLACEHOLDER
  linkedin: "your-linkedin-handle" # PLACEHOLDER

# Collections — this is what makes the site extensible.
# Add a new project or achievement by dropping a new .md file into
# _projects/ or _achievements/. No template/layout edits needed.
collections:
  projects:
    output: true
    permalink: /projects/:path/
  achievements:
    output: true
    permalink: /achievements/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "achievements"
    values:
      layout: "default"

sass:
  sass_dir: _sass

markdown: kramdown
plugins:
  - jekyll-feed
