---
layout: default
title: Research & Achievements
---
<h1 data-reveal>Research &amp; Achievements</h1>
<p class="page-intro" data-reveal>Academic work, awards, and research — extended as things come up.</p>

<div class="timeline" data-reveal-group>
  {% for item in site.achievements %}
    <div class="timeline__item" data-reveal>
      {% if item.date %}<span class="timeline__date">{{ item.date | date: "%B %Y" }}</span>{% endif %}
      <h2>{{ item.title }}</h2>
      <div>{{ item.content }}</div>
    </div>
  {% endfor %}
</div>
